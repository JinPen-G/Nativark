services:
  mysql:
    image: mysql:8.4
    container_name: rental-os-mysql
    restart: unless-stopped
    # Local development: retain binary logs for seven days, without disabling logging.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --binlog-expire-logs-seconds=604800 --binlog-expire-logs-auto-purge=ON
    environment:
      MYSQL_ROOT_PASSWORD: rental_os_root
      MYSQL_DATABASE: rental_os
      MYSQL_USER: rental_os
      MYSQL_PASSWORD: rental_os
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: rental-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
