services:
  mysql:
    image: mysql:8.4
    container_name: rimo-store-rental-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rimo_root
      MYSQL_DATABASE: rimo_store_rental
      MYSQL_USER: rimo
      MYSQL_PASSWORD: rimo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: rimo-store-rental-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
