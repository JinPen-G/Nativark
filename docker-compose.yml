services:
  mysql:
    image: mysql:8.4
    container_name: store-rental-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: store_rental_root
      MYSQL_DATABASE: store_rental
      MYSQL_USER: store_rental
      MYSQL_PASSWORD: store_rental
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: store-rental-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
