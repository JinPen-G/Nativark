<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0a0b0e" />
<title>Rental OS｜面向多行业的租赁经营平台</title>
<link rel="icon" href="favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="preload" as="image" href="assets/industry-car-960.webp" fetchpriority="high" />
<style>
  :root{
    --bg:#0a0b0e; --accent:#0a84ff; --accent-2:#5b9bff;
    --hi:#fff; --text:rgba(255,255,255,.72); --dim:rgba(255,255,255,.5);
    --line:rgba(255,255,255,.14);
    --fw-r:400; --fw-m:500; --fw-s:600; --fw-b:700;
    --nav-h:68px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--hi);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.6;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  /* ---------- nav ---------- */
  .nav{position:fixed;inset:0 0 auto;height:var(--nav-h);z-index:50;display:flex;align-items:center;
    justify-content:space-between;padding:0 clamp(18px,4vw,44px);
    background:linear-gradient(180deg,rgba(10,11,14,.5),rgba(10,11,14,0));
    border-bottom:1px solid transparent;transition:background .4s ease,border-color .4s ease}
  .nav.is-stuck{background:rgba(10,11,14,.72);backdrop-filter:blur(14px) saturate(1.3);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom-color:var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:var(--fw-b);letter-spacing:-.01em;font-size:19px;white-space:nowrap}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px 1px var(--accent)}
  .nav-links{display:flex;gap:clamp(18px,2.4vw,34px);font-size:14.5px;color:var(--text)}
  .nav-links a{transition:color .2s}
  .nav-links a:hover{color:var(--hi)}
  .nav-right{display:flex;align-items:center;gap:14px}
  .lang{font-size:13px;color:var(--text);letter-spacing:.02em;padding:6px 4px;transition:color .2s}
  .lang:hover{color:var(--hi)}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;font-weight:var(--fw-s);
    font-size:14.5px;padding:10px 20px;white-space:nowrap;transition:transform .2s,box-shadow .3s,background .25s,border-color .25s}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 22px -6px rgba(10,132,255,.7)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 30px -6px rgba(10,132,255,.85)}
  .btn-ghost{border:1px solid var(--line);color:var(--hi);background:rgba(255,255,255,.02)}
  .btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
  /* ---------- hero ---------- */
  .hero{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;isolation:isolate;background:#06070a}
  .hero-slides{position:absolute;inset:0;z-index:0}
  .slide{position:absolute;inset:0;background-position:center;background-size:cover;opacity:0;
    transform:scale(1.06);transition:opacity 1.4s ease;will-change:opacity,transform}
  .slide.is-active{opacity:1}
  .hero.play .slide.is-active{animation:kb 9s ease-out forwards}
  @keyframes kb{from{transform:scale(1.06)}to{transform:scale(1.16)}}
  .scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 42%,rgba(6,7,10,.32) 0%,rgba(6,7,10,.12) 38%,rgba(6,7,10,.74) 100%),
      linear-gradient(180deg,rgba(6,7,10,.55) 0%,rgba(6,7,10,.08) 22%,rgba(6,7,10,.12) 55%,rgba(6,7,10,.88) 100%)}
  .glow{position:absolute;z-index:1;left:50%;top:43%;width:min(1080px,124vw);height:min(1080px,124vw);
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(circle,rgba(10,132,255,.26) 0%,rgba(10,132,255,.07) 32%,transparent 62%)}
  .hero-inner{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:clamp(16px,2vw,26px);
    padding:calc(var(--nav-h) + 40px) clamp(22px,6vw,48px) 118px;text-shadow:0 2px 30px rgba(0,0,0,.32)}
  .kicker{margin:0;font-size:13px;font-weight:var(--fw-s);letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .title{margin:0;font-weight:var(--fw-b);line-height:.94;letter-spacing:-.035em;font-size:clamp(44px,8.2vw,116px)}
  .title span{display:block}
  .title .accent{background:linear-gradient(92deg,#fff 18%,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
  .sub{margin:0;max-width:58ch;font-size:clamp(15.5px,1.5vw,20px);font-weight:var(--fw-r);color:var(--text);line-height:1.6}
  .cta-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:clamp(6px,1vw,14px)}
  .cta-row .btn{padding:13px 26px;font-size:15.5px}
  /* entrance */
  .hero-inner>*{opacity:0;transform:translateY(22px)}
  .hero.ready .hero-inner>*{animation:up .9s cubic-bezier(.22,.61,.36,1) forwards}
  .hero.ready .hero-inner>*:nth-child(2){animation-delay:.08s}
  .hero.ready .hero-inner>*:nth-child(3){animation-delay:.16s}
  .hero.ready .hero-inner>*:nth-child(4){animation-delay:.24s}
  @keyframes up{to{opacity:1;transform:none}}
  /* category label + controls */
  .cat{position:absolute;z-index:3;left:clamp(18px,4vw,44px);bottom:clamp(22px,3vw,36px);
    display:flex;flex-direction:column;gap:3px;pointer-events:none}
  .cat .en b{font-size:13px;font-weight:var(--fw-s);letter-spacing:.2em;text-transform:uppercase;color:var(--hi)}
  .cat .zh b{font-size:12.5px;color:var(--text)}
  .cat b{display:inline-block;transition:opacity .45s ease}
  .controls{position:absolute;z-index:3;right:clamp(18px,4vw,44px);bottom:clamp(22px,3vw,36px);display:flex;gap:14px;align-items:center}
  .dots{display:flex;gap:7px}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.32);transition:background .3s,width .3s;cursor:pointer}
  .dots i.on{background:#fff;width:20px;border-radius:4px}
  .pause{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
    color:var(--hi);background:rgba(0,0,0,.28);transition:background .2s,border-color .2s}
  .pause:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35)}
  .pause svg{width:14px;height:14px}
  .scroll-cue{position:absolute;z-index:3;left:50%;bottom:clamp(18px,2.4vw,26px);transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dim);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase}
  .scroll-cue .ln{width:1px;height:34px;background:linear-gradient(var(--dim),transparent);animation:cue 2.2s ease-in-out infinite}
  @keyframes cue{0%,100%{opacity:.35;transform:scaleY(.7)}50%{opacity:1;transform:scaleY(1)}}
  @media(max-width:860px){
    .nav-links{display:none}
    .cat,.scroll-cue{display:none}
    .title{letter-spacing:-.02em}
    .hero-inner{padding-bottom:92px}
  }
  @media(prefers-reduced-motion:reduce){
    .slide{transition:none}
    .hero.play .slide.is-active{animation:none}
    .hero.ready .hero-inner>*{animation:none;opacity:1;transform:none}
    .scroll-cue .ln{animation:none}
  }
</style>
</head>
<body>
  <header class="nav" id="nav">
    <a class="brand" href="#top"><span class="dot"></span>Rental OS</a>
    <nav class="nav-links">
      <a href="#solutions">行业方案</a>
      <a href="#platform">平台能力</a>
      <a href="#cases">客户案例</a>
    </nav>
    <div class="nav-right">
      <button class="lang" id="lang" type="button">EN</button>
      <a class="btn btn-primary" href="mailto:hello@rentalos.cn?subject=预约 Rental OS 演示" data-i18n>预约演示</a>
    </div>
  </header>

  <section class="hero play" id="top">
    <div class="hero-slides" id="slides">
      <div class="slide is-active" data-en="VEHICLE" data-zh="车辆载具" style="background-image:url('assets/industry-car-960.webp')"></div>
      <div class="slide" data-en="CAMERA" data-zh="摄影设备" style="background-image:url('assets/industry-camera-960.webp')"></div>
      <div class="slide" data-en="OUTDOOR" data-zh="户外露营" style="background-image:url('assets/industry-camping-960.webp')"></div>
      <div class="slide" data-en="EQUIPMENT" data-zh="工程设备" style="background-image:url('assets/industry-excavator-960.webp')"></div>
    </div>
    <div class="glow"></div>
    <div class="scrim"></div>

    <div class="hero-inner">
      <p class="kicker" data-i18n>多品类租赁 · 一体化经营平台</p>
      <h1 class="title"><span>ONE OS.</span><span class="accent">EVERY RENTAL BUSINESS.</span></h1>
      <p class="sub" data-i18n>一套系统，管理不同租赁业务。预约、订单、库存、门店、履约与结算，集中在同一个平台。</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="mailto:hello@rentalos.cn?subject=预约 Rental OS 演示" data-i18n>预约演示</a>
        <a class="btn btn-ghost" href="#solutions" data-i18n>查看行业方案</a>
      </div>
    </div>

    <div class="cat"><span class="en"><b id="catEn">VEHICLE</b></span><span class="zh"><b id="catZh">车辆载具</b></span></div>
    <div class="controls">
      <div class="dots" id="dots"></div>
      <button class="pause" id="pause" type="button" aria-label="暂停轮播">
        <svg viewBox="0 0 24 24" id="pauseIcon" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="scroll-cue"><span>Scroll</span><span class="ln"></span></div>
  </section>
<script>
(function(){
  var hero=document.getElementById('top');
  var nav=document.getElementById('nav');
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var catEn=document.getElementById('catEn'), catZh=document.getElementById('catZh');
  var dotsWrap=document.getElementById('dots');
  var i=0, timer=null, playing=true, DUR=5200;
  var rm=matchMedia('(prefers-reduced-motion:reduce)').matches;

  slides.forEach(function(s,idx){
    var d=document.createElement('i'); if(idx===0)d.className='on';
    d.addEventListener('click',function(){go(idx);restart();});
    dotsWrap.appendChild(d);
  });
  var dots=[].slice.call(dotsWrap.children);

  function go(n){
    slides[i].classList.remove('is-active'); dots[i].classList.remove('on');
    i=(n+slides.length)%slides.length;
    slides[i].classList.add('is-active'); dots[i].classList.add('on');
    catEn.style.opacity=0; catZh.style.opacity=0;
    setTimeout(function(){
      catEn.textContent=slides[i].dataset.en; catZh.textContent=slides[i].dataset.zh;
      catEn.style.opacity=1; catZh.style.opacity=1;
    },240);
  }
  function next(){go(i+1);}
  function start(){ if(rm)return; playing=true; hero.classList.add('play'); clearInterval(timer); timer=setInterval(next,DUR); }
  function stop(){ clearInterval(timer); timer=null; playing=false; hero.classList.remove('play'); }
  function restart(){ if(playing&&!rm){clearInterval(timer); timer=setInterval(next,DUR);} }
  var pause=document.getElementById('pause'), pIcon=document.getElementById('pauseIcon');
  pause.addEventListener('click',function(){
    if(playing){stop();pIcon.innerHTML='<path d="M8 5v14l11-7z" fill="currentColor"/>';pause.setAttribute('aria-label','播放轮播');}
    else{start();pIcon.innerHTML='<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>';pause.setAttribute('aria-label','暂停轮播');}
  });
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){restart();} else {clearInterval(timer);timer=null;} });
    },{threshold:.15}).observe(hero);
  }
  var onScroll=function(){ nav.classList.toggle('is-stuck',window.scrollY>20); };
  onScroll(); window.addEventListener('scroll',onScroll,{passive:true});
  requestAnimationFrame(function(){requestAnimationFrame(function(){hero.classList.add('ready');});});
  if(!rm) start();

  var EN={
    '多品类租赁 · 一体化经营平台':'MULTI-CATEGORY RENTAL · ONE PLATFORM',
    '一套系统，管理不同租赁业务。预约、订单、库存、门店、履约与结算，集中在同一个平台。':'One system for every rental business — booking, orders, inventory, stores, fulfillment and settlement, all on one platform.',
    '预约演示':'Book a demo',
    '查看行业方案':'See solutions'
  };
  var ZH={}; Object.keys(EN).forEach(function(k){ZH[EN[k]]=k;});
  var langBtn=document.getElementById('lang'), lang='zh';
  langBtn.addEventListener('click',function(){
    var toEn=lang==='zh', map=toEn?EN:ZH;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var t=el.textContent.trim(); if(map[t])el.textContent=map[t];
    });
    lang=toEn?'en':'zh'; langBtn.textContent=toEn?'中':'EN'; document.documentElement.lang=toEn?'en':'zh-CN';
  });
})();
</script>

</body>
</html>
