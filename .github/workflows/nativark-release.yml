name: 历史 Rental 组合复建

on:
  workflow_dispatch:
    inputs:
      legacy_commit:
        description: 已验旧组合源码的完整 SHA
        required: true
        default: 46db0945dee92ac916f7265e95948943fc8b641d
        type: string

permissions:
  contents: read

jobs:
  images:
    if: github.repository == 'JinPen-G/Zelo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEGACY_COMMIT: ${{ inputs.legacy_commit }}
    steps:
      - name: 核对允许复建的历史提交
        shell: bash
        run: |
          set -euo pipefail
          test "$LEGACY_COMMIT" = 46db0945dee92ac916f7265e95948943fc8b641d
      - name: 检出完整历史组合
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.LEGACY_COMMIT }}
          persist-credentials: false
      - name: 复建并验证同版历史 API 和 Web
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LEGACY_COMMIT"
          for service in api web; do
            docker build --file scripts/ops/deployment/Dockerfile --target "$service" \
              --build-arg "PRODUCT_COMMIT=$LEGACY_COMMIT" --tag "nativark-$service:$LEGACY_COMMIT" .
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "nativark-$service:$LEGACY_COMMIT")" = "$LEGACY_COMMIT"
          done
          docker run --rm --network none --entrypoint sh "nativark-api:$LEGACY_COMMIT" -ec \
            'test -s dist/main.js && test -s prisma/schema.prisma &&
             test ! -d /app/docs && test ! -d /app/output &&
             node -e "
               const fs = require(\"node:fs\");
               if (process.getuid() === 0) throw Error(\"Expected non-root runtime\");
               for (const name of fs.readdirSync(\"prisma/migrations\")) {
                 const directory = \"prisma/migrations/\" + name;
                 if (fs.statSync(directory).isDirectory()) {
                   fs.readFileSync(directory + \"/migration.sql\");
                 }
               }
               require(\"/app/config/environment.cjs\");
               require(\"@prisma/client\");
               require(\"./dist/app.module.js\");
             "'
          docker run --rm --network none --entrypoint sh "nativark-web:$LEGACY_COMMIT" -ec \
            'test -s /usr/share/nginx/html/index.html && nginx -V >/dev/null 2>&1'
          python3 scripts/ops/deployment/hourly-update.py --self-test
