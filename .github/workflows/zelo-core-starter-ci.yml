            actorAssignment = await core('member-assignments', admin.token, { userId: user.id, state: 'assigned', expectedRevision: actorAssignment.revision, operationId: randomUUID() });
            assert.equal((await request(api + '/tickets/' + revokedTicket.id, actor.token)).revision, revokedTicket.revision);
