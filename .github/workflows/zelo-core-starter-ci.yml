            const current = (await request('/api/platform/subscriptions/' + tenantId, saas.token)).overview;
            await request('/api/platform/subscriptions/' + tenantId + '/feature-grants', saas.token, { featureCode: 'ai.native.use', expectedRevision: current.revision, reason: '本job显式授权' }, 201);
            assert.equal((await ai('status', actor.token, { ticketId: first.id })).state, 'unpublished');
            const limits = { maxSteps: 1, maxCalls: 1, maxConcurrent: 1, maxTotalMs: 120000, maxStepMs: 15000, maxOutputBytes: 65536 };
