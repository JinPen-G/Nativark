            tenantGrant = await core('tenant-grants', saas.token, { tenantId, state: 'disabled', expectedRevision: tenantGrant.revision, operationId: randomUUID() });
            tenantGrant = await core('tenant-grants', saas.token, { tenantId, state: 'enabled', expectedRevision: tenantGrant.revision, operationId: randomUUID() });
            await rpc('tools/list', {}, 401);
            await core('member-assignments', admin.token, { userId: user.id, state: 'assigned', expectedRevision: assignment.revision, operationId: randomUUID() });
            stage = 'original-cumulative-limit';
            // 同一个已批准输入与原目标，覆盖原20次额度；不换grant、任务或会话重置。
            for (let index = 1; index < 20; index++) { const next = await rpc('tools/call', { name: 'example_tickets_get', arguments: { ticketId } }); assert.equal(next.result.isError, undefined); }
            const denied = await rpc('tools/call', { name: 'example_tickets_get', arguments: { ticketId } }); assert(denied.error || denied.result?.isError);
            original = await control('original', actor.token, { grantId }); assert.equal(original.goal.id, goalId); assert.equal(original.budget.consumedCalls, 20);
            // 该actor的原登录与Chrome同意会话不同：原账可读，但不能借另一会话重新绑定或清零。
            const grant = await control('grant', actor.token, { grantId }); await control('revoke', actor.token, { grantId, expectedRevision: grant.grant.revision });
            await rpc('tools/list', {}, 401); assert.equal((await control('original', actor.token, { grantId })).budget.consumedCalls, 20);
            console.log('tenant MCP：正式包/同库、原身份人工同意与字段审核、PKCE/OAuth、持久读取/原账、撤权/停用重开/累计限额通过；无平台模型或AI权益');
          } catch (error) { console.error('工单MCP阶段：' + stage); if (session) { try { console.error(redact(await dom('return document.body.innerText'))); } catch {} } throw error; }
          finally { if (session) await driver(session, undefined, 'DELETE'); }
          NODE
      - name: 清理本 job 临时材料
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          test "$CI_DIR" = output/.tmp/zelo-core-starter-ci
          test "$(realpath -m "$task")" = "$GITHUB_WORKSPACE/output/.tmp/zelo-core-starter-ci"
          rm -rf -- "$task"
          test ! -e "$task"
