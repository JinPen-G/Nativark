name: Zelo 零 Core 构建与启动

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zelo-platform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [platform, public-ai]
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: zelo_ci_root_only
          MYSQL_DATABASE: zelo_platform_ci
          MYSQL_USER: zelo_ci
          MYSQL_PASSWORD: zelo_ci_database_only
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql://zelo_ci:zelo_ci_database_only@127.0.0.1:3306/zelo_platform_ci?connection_limit=1
      CI_DIR: output/.tmp/zelo-platform-ci
      CI_PROFILE: ${{ matrix.profile }}
    steps:
      - name: 检出本次提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ${{ env.CI_DIR }}/source
          persist-credentials: false
      - name: 固定 Node 工具链
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: 导出不含业务的底座源码
        working-directory: ${{ env.CI_DIR }}/source
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Check the public Git tree as well as the archive; export-ignore alone
          # does not keep maintainer originals out of a public checkout.
          tracked_private=$(git ls-tree -r --name-only "$GITHUB_SHA" -- \
            docs assets .impeccable apps/deepseek-harness-clone apps/deepseek-harness-original \
            apps/primefold-clone apps/website apps/website-next \
            apps/api apps/admin apps/rental-api apps/rental-admin \
            apps/example-multi-core-api apps/example-multi-core-admin \
            apps/tenant-website apps/enterprise-portal apps/miniprogram apps/staff-miniprogram \
            packages/rental-core packages/rental-mcp-host packages/rental-ai-adapters \
            packages/shared packages/web-client)
          if [[ -n "$tracked_private" ]]; then
            echo '公开源码仍追踪维护者原稿、参考镜像或已迁出的业务副本' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { strict as assert } from 'node:assert';
          import { execFileSync } from 'node:child_process';
          import { posix as path } from 'node:path';
          const commit = process.env.GITHUB_SHA;
          const git = (...args) => execFileSync('git', ['--no-replace-objects', '--no-lazy-fetch', ...args],
            { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 });
          for (const name of ['ai-native-server', 'ai-native-admin', 'ai-native-data']) {
            const directory = `packages/${name}/`;
            const files = git('ls-tree', '-r', '--name-only', '-z', commit, '--', directory)
              .split('\0').filter(Boolean).map(file => file.slice(directory.length));
            const tracked = new Set(files);
            const manifest = JSON.parse(git('show', `${commit}:${directory}public-source-files.json`));
            assert(Array.isArray(manifest.files) && manifest.files.length > 0, `${name} 缺少正式公共源码清单`);
            const declared = new Set(manifest.files);
            assert.equal(declared.size, manifest.files.length, `${name} 公共源码清单重复`);
            for (const file of declared) {
              assert(typeof file === 'string' && file && !file.includes('\\') && !path.isAbsolute(file)
                && path.normalize(file) === file && file !== '..' && !file.startsWith('../'),
              `${name} 公共源码路径无效`);
              assert(tracked.has(file), `${name} 公共源码清单缺件：${file}`);
            }
            // Historical tests remain evidence. Runtime sources, data and package
            // metadata must belong to the committed public package selection.
            const extra = files.filter(file => !declared.has(file) && !/^(?:test|tests)\//u.test(file));
            assert.equal(extra.length, 0, `${name} 仍追踪非公共源码：${extra.slice(0, 12).join(', ')}`);
          }
          console.log('公开 Git 树的业务退场与三份 AI 源码清单通过');
          NODE
          if [[ "$CI_PROFILE" == platform ]]; then
            npm ci --workspace @rental-os/core-contracts --include-workspace-root --ignore-scripts \
              --no-audit --no-fund --cache "$task/npm-cache"
            npm run build -w @rental-os/core-contracts
            node packages/core-contracts/dist/export-platform.js --repo . \
              --repository https://github.com/JinPen-G/Nativark --commit "$GITHUB_SHA" --out "$task/platform.tgz"
          else
            npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
            mkdir "$task/offline"
            (
              export DATABASE_URL=mysql://offline:offline@127.0.0.1:1/rental_os_offline
              export AI_OFFLINE_WRITE_ROOT="$task" AI_OFFLINE_AUDIT="$task/offline/audit.log"
              export TEMP="$task/offline" TMP="$task/offline" TMPDIR="$task/offline" XDG_CACHE_HOME="$task/offline"
              node --no-compilation-cache --max-old-space-size=6144 \
                --require ./tests/fixtures/ai-native/prisma-offline-preload.cjs \
                scripts/prepare-platform-public-ai.cjs --repo . --repository https://github.com/JinPen-G/Nativark \
                --commit "$GITHUB_SHA" --out "$task/platform.tgz"
              test ! -e "$AI_OFFLINE_AUDIT"
            )
          fi
          tar -tzf "$task/platform.tgz" > "$task/archive.list"
          if grep -Eq '^(\./)?(assets|\.impeccable)(/|$)|(^|/)(docs|node_modules|output|deepseek-harness-clone|deepseek-harness-original|primefold-clone)(/|$)|^(apps/(api|rental-api|rental-admin|website|website-next)|packages/(rental-core|rental-mcp-host|shared))(/|$)' "$task/archive.list"; then
            echo '底座归档含私有资料或业务实现' >&2
            exit 1
          fi
          mkdir "$task/platform"
          tar -xzf "$task/platform.tgz" -C "$task/platform"
      - name: 独立安装、构建和登录
        working-directory: ${{ env.CI_DIR }}/platform
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          export AUTH_TOKEN_SECRET="$(openssl rand -hex 32)" SEED_PLATFORM_PASSWORD="ZeloCi9-$(openssl rand -hex 12)"
          export API_PORT=3091 API_PROXY_TARGET=http://127.0.0.1:3091 VITE_API_BASE_URL=/api DATABASE_CONNECT_ON_START=true
          npm ci --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
          node node_modules/@prisma/engines/scripts/postinstall.js
          npm run db:generate
          npm run build
          for tool in platform-doctor platform-doctor-install platform-doctor-upgrade; do
            node "scripts/ops/$tool.cjs" --help > /dev/null
          done
          if [[ "$CI_PROFILE" == public-ai ]]; then
            export CORE_DEPLOYMENT_LOCK_FILE="$PWD/apps/platform-api/prisma-deployment/core.deployment.lock.json"
            export PLATFORM_AI_DATA_PACKAGE_DIR="$PWD/public-ai-data" PLATFORM_AI_PROFILE_ID=ci-public-profile
          fi
          approval=$(node scripts/ops/platform-doctor-install.cjs status --profile "$CI_PROFILE" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const r=JSON.parse(s);if(r.state!=="empty"){console.error(r);process.exit(1)}process.stdout.write(r.migrationApproval)})')
          node --input-type=module <<'INSTALL_GATES'
          import { strict as assert } from 'node:assert';
          import { createRequire } from 'node:module';
          import { spawnSync } from 'node:child_process';
          const require = createRequire(process.cwd() + '/package.json');
          const { PrismaClient } = require('./apps/platform-api/generated/client');
          const db = new PrismaClient({ datasourceUrl: process.env.DATABASE_URL });
          const invoke = (command, extra = []) => {
            const result = spawnSync(process.execPath, ['scripts/ops/platform-doctor-install.cjs', command,
              '--profile', process.env.CI_PROFILE, ...extra], { encoding: 'utf8' });
            return { code: result.status, value: JSON.parse(result.stdout) };
          };
          let created = false;
          try {
            const refused = invoke('migrate', ['--approve', '0'.repeat(64)]);
            assert.equal(refused.code, 1); assert.equal(refused.value.status, 'refused');
            assert.equal(invoke('status').value.state, 'empty');
            await db.$executeRaw`CREATE TABLE zp01_unknown_probe (id INT PRIMARY KEY)`; created = true;
            const unknown = invoke('status'); assert.equal(unknown.code, 1); assert.equal(unknown.value.state, 'incompatible');
            assert.equal(invoke('migrate', ['--approve', unknown.value.migrationApproval]).value.status, 'refused');
            assert.equal(invoke('initialize').value.status, 'refused');
            const objects = await db.$queryRaw`SELECT TABLE_NAME AS name FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE()`;
            assert.deepEqual(objects, [{ name: 'zp01_unknown_probe' }], '未知旧库拒绝不得添加迁移账或账号表');
            console.log('A01：未批准迁移与无原账旧库均拒绝，未产生初始化或迁移写入');
          } finally {
            if (created) await db.$executeRaw`DROP TABLE zp01_unknown_probe`;
            await db.$disconnect();
          }
          INSTALL_GATES
          node scripts/ops/platform-doctor-install.cjs migrate --profile "$CI_PROFILE" --approve "$approval"
          npm run db:migrate:deploy
          node scripts/ops/platform-doctor-install.cjs initialize --profile "$CI_PROFILE"
          npm run db:initialize
          node scripts/ops/platform-doctor-install.cjs status --profile "$CI_PROFILE" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const r=JSON.parse(s);if(r.state!=="ready"||r.initialization.state!=="initialized"||r.initialization.receipt!=="recorded"){console.error(r);process.exit(1)}})'
          SEED_PLATFORM_PASSWORD=RepeatCheck9 node scripts/ops/platform-doctor-install.cjs initialize --profile "$CI_PROFILE"
          # The selected AI host may use its local database. The smoke has no provider or supplier credentials.
          if [[ "$CI_PROFILE" == public-ai ]]; then
            export CORE_DEPLOYMENT_LOCK_FILE="$PWD/apps/platform-api/prisma-deployment/core.deployment.lock.json"
            export PLATFORM_AI_DATA_PACKAGE_DIR="$PWD/public-ai-data" PLATFORM_AI_PROFILE_ID=ci-public-profile
            npm run grant:ai -- --role role_saas_admin --access manage
            entry=apps/platform-api/dist-ai/ai-main.js
            web_args=(--mode public-ai --outDir dist-ai)
          else
            entry=apps/platform-api/dist/main.js
            web_args=()
          fi
          node "$entry" > "$task/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" ${web_pid:+"$web_pid"} 2>/dev/null || true; wait || true' EXIT
          node node_modules/vite/bin/vite.js preview apps/platform-admin --host 127.0.0.1 --port 5191 --strictPort "${web_args[@]}" > "$task/web.log" 2>&1 &
          web_pid=$!
          if ! curl -fsS --retry 15 --retry-connrefused --max-time 5 http://127.0.0.1:5191/api/health -o "$task/health.json"; then
            tail -n 30 "$task/api.log" "$task/web.log"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { strict as assert } from 'node:assert';
          const web = 'http://127.0.0.1:5191';
          async function request(path, init) {
            const response = await fetch(web + path, { ...init, signal: AbortSignal.timeout(8000) });
            assert(response.ok, `${path}: HTTP ${response.status}`);
            return response;
          }
          const body = async (path, init) => { const json = await (await request(path, init)).json(); return json.data ?? json; };
          assert.equal((await body('/api/health')).service, 'nativark-platform-api');
          const login = await (await request('/login')).text();
          const entry = /<script\b[^>]*\bsrc="(\/assets\/[^"/]+\.js)"/.exec(login)?.[1];
          assert(entry, '独立后台缺少正式编译入口');
          assert.match((await request(entry)).headers.get('content-type') ?? '', /javascript/);
          const session = await body('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tenantCode: 'platform', account: 'admin', password: process.env.SEED_PLATFORM_PASSWORD }) });
          assert(typeof session.accessToken === 'string' && session.accessToken.length > 0, '独立公共登录未返回会话');
          const me = await body('/api/auth/session-context', { headers: { Authorization: `Bearer ${session.accessToken}` } });
          assert.equal(me.tenant.tenantCode, 'platform');
          assert.equal(me.user.account, 'admin');
          console.log('零 Core：独立 MySQL 迁移、公共后台产物、代理、登录及真实会话通过');
          if (process.env.CI_PROFILE === 'public-ai') {
            const json = { 'Content-Type': 'application/json' };
            const changed = await body('/api/auth/change-password', { method: 'POST',
              headers: { ...json, Authorization: `Bearer ${session.accessToken}` },
              body: JSON.stringify({ currentPassword: process.env.SEED_PLATFORM_PASSWORD,
                newPassword: `${process.env.SEED_PLATFORM_PASSWORD}-New8!` }) });
            const headers = { ...json, Authorization: `Bearer ${changed.accessToken}` };
            const operationKey = 'ci-public-model-save', id = process.env.PLATFORM_AI_PROFILE_ID;
            const provider = '/api/platform/ai/providers/' + id;
            const result = await body(provider, { method: 'PUT', headers, body: JSON.stringify({
              expectedRevision: 0, operationKey, protocol: 'openai_chat_completions', model: 'ci-only',
              baseUrl: 'https://model.example.invalid/v1', maxOutputTokens: 32, enabled: false,
              allowedCapabilities: [], secretChange: { operation: 'clear' }
            }) });
            assert.equal(result.profileId, id);
            assert.equal(result.revision, 1);
            assert.equal(result.enabled, false);
            assert.equal(result.credentialConfigured, false);
            const receipt = await body(`${provider}/operations/${operationKey}`, { headers });
            assert.equal(receipt.state, 'recorded');
            assert.equal(receipt.operationKey, operationKey);
            assert.equal(receipt.resultRevision, 1);
            console.log('公共 AI：选装 API 和后台、显式授权、单连接模型保存及原键收据通过');
          }
          NODE
          if [[ "$CI_PROFILE" == platform ]]; then
            # A01 使用本 job 的独占库；固定两版公共数据完全一致后只切换程序。
            kill "$api_pid" "$web_pid"
            wait "$api_pid" "$web_pid" || true
            api_pid= web_pid=
            export CI_UPGRADE_ROOT="$task/upgrade"
            test ! -e "$CI_UPGRADE_ROOT"
            cleanup_upgrade() {
              test "$CI_UPGRADE_ROOT" = "$GITHUB_WORKSPACE/$CI_DIR/upgrade" && test ! -L "$CI_UPGRADE_ROOT" || return 1
              rm -rf -- "$CI_UPGRADE_ROOT"
              test ! -e "$CI_UPGRADE_ROOT"
            }
            trap cleanup_upgrade EXIT
            mkdir -p "$CI_UPGRADE_ROOT/storage/archives" "$CI_UPGRADE_ROOT/storage/candidates"
            for pair in previous:016086943419e3462fc7763a856f97de6d32b279 candidate:f3bfce5800ea971af6148e843f1e63437d5fa94a; do
              label="${pair%%:*}" commit="${pair#*:}"
              git -C "$task/source" fetch --no-tags --depth=1 origin "$commit"
              test "$(git -C "$task/source" rev-parse "$commit^{commit}")" = "$commit"
              node "$task/source/packages/core-contracts/dist/export-platform.js" --repo "$task/source" \
                --repository https://github.com/JinPen-G/Nativark --commit "$commit" \
                --out "$CI_UPGRADE_ROOT/storage/archives/$label.tgz" > "$CI_UPGRADE_ROOT/$label.source.json"
              mkdir "$CI_UPGRADE_ROOT/$label"
              tar -xzf "$CI_UPGRADE_ROOT/storage/archives/$label.tgz" -C "$CI_UPGRADE_ROOT/$label"
              (
                cd "$CI_UPGRADE_ROOT/$label"
                npm ci --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
                node node_modules/@prisma/engines/scripts/postinstall.js
                npm run db:generate
                npm run build -w @rental-os/platform-api
              )
            done
            node --input-type=module <<'UPGRADE'
          import { strict as assert } from 'node:assert';
          import { createRequire } from 'node:module';
          import { readFileSync, writeFileSync, openSync, closeSync, renameSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          import { spawn } from 'node:child_process';
          import { once } from 'node:events';
          import { createServer } from 'node:http';
          import { isDeepStrictEqual } from 'node:util';
          const require = createRequire(process.cwd() + '/package.json'), root = process.env.CI_UPGRADE_ROOT;
          const api = require('@rental-os/core-contracts'), storage = join(root, 'storage');
          const read = file => JSON.parse(readFileSync(file, 'utf8'));
          const write = (file, value) => writeFileSync(file, JSON.stringify(value) + '\n', { flag: 'wx' });
          const releases = new Map();
          for (const [label, version] of [['previous', '0.2.1'], ['candidate', '0.2.2']]) {
            const source = read(join(root, label + '.source.json'));
            assert.equal(source.version, version);
            const data = require(join(root, label, 'apps/platform-api/dist/platform-data.js')).createPublicPlatformDataPlan().data;
            const release = api.CorePlatformReleaseSchema.parse({ source: source.source, sha256: source.sha256, data,
              versions: { platform: version, contract: api.CORE_CONTRACT_VERSION, node: process.versions.node, capabilities: {} } });
            releases.set(label, release);
            write(join(root, label + '.lock.json'), api.CoreDeploymentLockSchema.parse({ lockVersion: 1, platform: release, cores: [] }));
          }
          assert(isDeepStrictEqual(releases.get('previous').data, releases.get('candidate').data), '本次程序升级不得改变迁移链');
          const toolsSource = read('platform.source.json'), toolsVersion = read('package.json').version;
          assert(api.compareCoreReleaseVersions(toolsVersion, '0.2.2') > 0, '含新入口的发行必须使用严格前进版本');
          const toolsArchive = join(root, 'storage/archives/tools.tgz');
          assert.equal(root, join(process.env.GITHUB_WORKSPACE, process.env.CI_DIR, 'upgrade'));
          renameSync(join(process.env.GITHUB_WORKSPACE, process.env.CI_DIR, 'platform.tgz'), toolsArchive);
          const toolsRelease = api.CorePlatformReleaseSchema.parse({ source: toolsSource.source,
            sha256: createHash('sha256').update(readFileSync(toolsArchive)).digest('hex'),
            data: require('./apps/platform-api/dist/platform-data.js').createPublicPlatformDataPlan().data,
            versions: { platform: toolsVersion, contract: api.CORE_CONTRACT_VERSION, node: process.versions.node, capabilities: {} } });
          releases.set('tools', toolsRelease);
          write(join(root, 'tools.lock.json'), api.CoreDeploymentLockSchema.parse({ lockVersion: 1, platform: toolsRelease, cores: [] }));
          write(join(storage, 'archives/index.json'), { format: 'core-package-archives-1', artifacts: [...releases].map(([label, release]) =>
            ({ reference: label, file: label + '.tgz', artifact: { kind: 'platform', release } })) });
          const { PrismaClient } = require('./apps/platform-api/generated/client');
          const database = new PrismaClient({ datasourceUrl: process.env.DATABASE_URL });
          const origin = 'http://127.0.0.1:3091';
          let child, proxy, session, stage = 'start-previous';
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
          const stop = async () => {
            if (!child || child.exitCode !== null || child.signalCode !== null) return;
            const exited = once(child, 'exit'); child.kill('SIGTERM');
            const timer = setTimeout(() => child.kill('SIGKILL'), 10000);
            try { await exited; } finally { clearTimeout(timer); }
          };
          const start = async label => {
            const cwd = label === 'tools' ? process.cwd() : join(root, label), log = openSync(join(root, label + '.log'), 'a');
            try { child = spawn(process.execPath, ['apps/platform-api/dist/main.js'], { cwd,
              env: { ...process.env, CORE_PACKAGE_STORAGE_ROOT: storage,
                CORE_DEPLOYMENT_LOCK_FILE: join(root, label + '.lock.json'), CORE_PLATFORM_PACKAGE_REFERENCE: label },
              stdio: ['ignore', log, log] }); } finally { closeSync(log); }
            for (let attempt = 0; attempt < 60; attempt++) {
              assert(child.exitCode === null && child.signalCode === null, '固定宿主提前退出');
              try { const response = await fetch(origin + '/api/health', { signal: AbortSignal.timeout(1000) });
                if (response.ok) return; } catch {}
              await pause(500);
            }
            throw Error('health_unavailable');
          };
          const request = async (path, body, token = session) => {
            const response = await fetch(origin + '/api/' + path, { method: body === undefined ? 'GET' : 'POST',
              headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }), signal: AbortSignal.timeout(45000) });
            assert(response.ok, `原 HTTP ${path}: ${response.status}`); const json = await response.json(); return json.data ?? json;
          };
          const cli = async (args, address = origin, script = 'platform-doctor-upgrade') => {
            const process = spawn(globalThis.process.execPath, ['scripts/ops/' + script + '.cjs', ...args], {
              env: { ...globalThis.process.env, PLATFORM_DOCTOR_API_URL: address, PLATFORM_DOCTOR_ACCESS_TOKEN: session },
              stdio: ['ignore', 'pipe', 'pipe'] });
            let stdout = ''; process.stdout.on('data', chunk => { stdout += chunk; }); process.stderr.resume();
            const [code] = await once(process, 'exit'); return { code, value: JSON.parse(stdout) };
          };
          const snapshot = async () => ({
            roles: await database.role.findMany({ orderBy: { id: 'asc' } }),
            grants: await database.rolePermission.findMany({ orderBy: [{ roleId: 'asc' }, { permissionId: 'asc' }] }),
            assignments: await database.userRole.findMany({ orderBy: [{ userId: 'asc' }, { roleId: 'asc' }] }),
            configuration: await database.systemParameterSet.findMany({ orderBy: { id: 'asc' } }),
            migrations: await database.$queryRaw`SELECT id, migration_name, checksum, finished_at, rolled_back_at, applied_steps_count FROM _prisma_migrations ORDER BY started_at, id`,
            initializations: await database.operationLog.count({ where: { action: 'platform.initialized' } }),
            preparations: await database.operationLog.count({ where: { action: 'core.package.preparation.requested' } })
          });
          try {
            await start('previous');
            const login = await request('auth/login', { tenantCode: 'platform', account: 'admin', password: process.env.SEED_PLATFORM_PASSWORD }, null);
            session = login.accessToken;
            const password = process.env.SEED_PLATFORM_PASSWORD + '-Upgrade8!';
            session = (await request('auth/change-password', { currentPassword: process.env.SEED_PLATFORM_PASSWORD, newPassword: password })).accessToken;
            const config = await request('platform/security-baseline'); config.masking.email = true;
            const saved = await fetch(origin + '/api/platform/security-baseline', { method: 'PUT',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session }, body: JSON.stringify({ config }) });
            assert(saved.ok, '原安全配置保存失败');
            await saved.body.cancel();
            stage = 'current-and-candidate';
            const current = await cli(['status']); if (current.code) console.error(current.value); assert.equal(current.code, 0);
            assert.equal(current.value.current.platform.current.version, '0.2.1');
            const plan = await cli(['plan', '--kind', 'platform', '--reference', 'candidate']);
            if (plan.code) console.error(plan.value);
