            assert.equal(interrupted.code, 2); assert.equal(interrupted.value.status, 'unknown'); assert.equal(interrupted.value.sha256, sha256);
            if (published?.status !== 'prepared') console.error({ preparation: published?.status ?? 'no_response',
              reason: /^[a-z_]+$/.test(published?.error?.code ?? '') ? published.error.code : 'unavailable' });
            assert.equal(published?.status, 'prepared');
            proxy.closeAllConnections(); await new Promise(resolve => proxy.close(resolve)); proxy = undefined;
            const preparedAt = published.record.preparedAt, before = await snapshot();
            assert.equal(before.initializations, 1); assert.equal(before.preparations, 1);
            stage = 'original-receipt-after-restart';
            await stop(); await start('previous');
            const receipt = await cli(['receipt', '--sha256', sha256]);
            assert.equal(receipt.code, 0); assert.equal(receipt.value.status, 'recorded'); assert.equal(receipt.value.preparedAt, preparedAt);
            assert(isDeepStrictEqual(before, await snapshot()), '只读恢复不得新增原操作或改变数据');
            stage = 'compatible-runtime-switch';
            await stop(); await start('candidate');
            const updated = await cli(['status']); assert.equal(updated.code, 0);
            assert.equal(updated.value.current.platform.current.version, '0.2.2');
            const afterReceipt = await cli(['receipt', '--sha256', sha256]);
            assert.equal(afterReceipt.code, 0); assert.equal(afterReceipt.value.preparedAt, preparedAt);
            session = (await request('auth/login', { tenantCode: 'platform', account: 'admin', password }, null)).accessToken;
            assert.equal((await request('platform/security-baseline')).masking.email, true);
            assert(isDeepStrictEqual(before, await snapshot()), '兼容程序升级须保留配置、角色授权、原迁移和初始化/准备记录');
            console.log('A01：固定 0.2.1 → 0.2.2 兼容程序升级、真实准备失应答、重启原摘要恢复及配置/授权/迁移保留通过');
            stage = 'new-tools-maintenance-bridge';
            const oldRefusal = await cli(['plan', '--kind', 'platform', '--reference', 'tools']);
            assert.equal(oldRefusal.code, 1, '旧版未知脚本拒绝不能被放宽');
            assert(oldRefusal.value.inspectionIssues.some(issue => issue.code === 'platform_source_mismatch'), '须确认旧源码白名单拒绝原因');
            const bridge = await cli(['bridge', '--profile', 'platform', '--lock', join(root, 'tools.lock.json'),
              '--platform-package', toolsArchive, '--previous-lock', join(root, 'candidate.lock.json'),
              '--previous-package', join(storage, 'archives/candidate.tgz')], origin, 'platform-doctor-install');
            if (bridge.code) console.error(bridge.value);
            assert.equal(bridge.code, 0); assert.equal(bridge.value.status, 'maintenance_bridge_checked');
            assert.equal(bridge.value.deployment, 'pending');
            await stop();
            const stopped = await cli(['status', '--profile', 'platform', '--lock', join(root, 'tools.lock.json')], origin, 'platform-doctor-install');
            assert.equal(stopped.code, 0); assert.equal(stopped.value.state, 'ready');
            await start('tools');
            const tools = await cli(['status']); assert.equal(tools.code, 0);
            assert.equal(tools.value.current.platform.current.version, toolsVersion);
            session = (await request('auth/login', { tenantCode: 'platform', account: 'admin', password }, null)).accessToken;
            assert.equal((await request('platform/security-baseline')).masking.email, true);
            assert(isDeepStrictEqual(before, await snapshot()), '桥接不得重置配置/授权/原账或重复初始化');
            stage = 'unchanged-data-application-restore';
            await stop(); await start('candidate');
            assert.equal((await cli(['status'])).value.current.platform.current.version, '0.2.2');
            session = (await request('auth/login', { tenantCode: 'platform', account: 'admin', password }, null)).accessToken;
            assert.equal((await request('platform/security-baseline')).masking.email, true);
            assert(isDeepStrictEqual(before, await snapshot()), '同数据应用恢复不得修改原账或权限');
            await stop(); await start('tools');
            assert.equal((await cli(['status'])).value.current.platform.current.version, toolsVersion);
            assert.equal((await cli(['receipt', '--sha256', sha256])).value.preparedAt, preparedAt);
            console.log('A01：含新工具归档的只读桥接、真实运行切换与同数据应用恢复通过；候选来源：' + toolsSource.source.commit);
          } catch { console.error('A01 兼容升级未完成，阶段：' + stage); process.exitCode = 1; }
          finally {
            if (proxy) { proxy.closeAllConnections(); await new Promise(resolve => proxy.close(resolve)); }
            await stop(); await database.$disconnect();
          }
          UPGRADE
          fi
