                assert.equal(incoming.url, '/api/platform/core-packages/prepare');
                const chunks = []; for await (const chunk of incoming) chunks.push(chunk);
                const response = await fetch(origin + incoming.url, { method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: incoming.headers.authorization }, body: Buffer.concat(chunks) });
                assert(response.ok); const json = await response.json(); published = json.data ?? json;
                outgoing.destroy();
              } catch { outgoing.destroy(); }
            });
            proxy.listen(0, '127.0.0.1'); await once(proxy, 'listening');
            const interrupted = await cli(['prepare', '--kind', 'platform', '--reference', 'candidate', '--sha256', sha256],
