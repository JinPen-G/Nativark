name: Zelo 零 Core 构建与启动

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zelo-platform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [platform, public-ai]
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: zelo_ci_root_only
          MYSQL_DATABASE: zelo_platform_ci
          MYSQL_USER: zelo_ci
          MYSQL_PASSWORD: zelo_ci_database_only
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql://zelo_ci:zelo_ci_database_only@127.0.0.1:3306/zelo_platform_ci?connection_limit=1
      CI_DIR: output/.tmp/zelo-platform-ci
      CI_PROFILE: ${{ matrix.profile }}
    steps:
      - name: 检出本次提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ${{ env.CI_DIR }}/source
          persist-credentials: false
      - name: 固定 Node 工具链
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: 导出不含业务的底座源码
        working-directory: ${{ env.CI_DIR }}/source
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Check the public Git tree as well as the archive; export-ignore alone
          # does not keep maintainer originals out of a public checkout.
          tracked_private=$(git ls-tree -r --name-only "$GITHUB_SHA" -- \
            docs assets .impeccable apps/deepseek-harness-clone apps/deepseek-harness-original \
            apps/primefold-clone apps/website apps/website-next \
            apps/api apps/admin apps/rental-api apps/rental-admin \
            apps/example-multi-core-api apps/example-multi-core-admin \
            apps/tenant-website apps/enterprise-portal apps/miniprogram apps/staff-miniprogram \
            packages/rental-core packages/rental-mcp-host packages/rental-ai-adapters \
            packages/shared packages/web-client)
          if [[ -n "$tracked_private" ]]; then
            echo '公开源码仍追踪维护者原稿、参考镜像或已迁出的业务副本' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { strict as assert } from 'node:assert';
          import { execFileSync } from 'node:child_process';
          import { posix as path } from 'node:path';
          const commit = process.env.GITHUB_SHA;
          const git = (...args) => execFileSync('git', ['--no-replace-objects', '--no-lazy-fetch', ...args],
            { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 });
          for (const name of ['ai-native-server', 'ai-native-admin', 'ai-native-data']) {
            const directory = `packages/${name}/`;
            const files = git('ls-tree', '-r', '--name-only', '-z', commit, '--', directory)
              .split('\0').filter(Boolean).map(file => file.slice(directory.length));
            const tracked = new Set(files);
            const manifest = JSON.parse(git('show', `${commit}:${directory}public-source-files.json`));
            assert(Array.isArray(manifest.files) && manifest.files.length > 0, `${name} 缺少正式公共源码清单`);
            const declared = new Set(manifest.files);
            assert.equal(declared.size, manifest.files.length, `${name} 公共源码清单重复`);
            for (const file of declared) {
              assert(typeof file === 'string' && file && !file.includes('\\') && !path.isAbsolute(file)
                && path.normalize(file) === file && file !== '..' && !file.startsWith('../'),
              `${name} 公共源码路径无效`);
              assert(tracked.has(file), `${name} 公共源码清单缺件：${file}`);
            }
            // Historical tests remain evidence. Runtime sources, data and package
            // metadata must belong to the committed public package selection.
            const extra = files.filter(file => !declared.has(file) && !/^(?:test|tests)\//u.test(file));
            assert.equal(extra.length, 0, `${name} 仍追踪非公共源码：${extra.slice(0, 12).join(', ')}`);
          }
          console.log('公开 Git 树的业务退场与三份 AI 源码清单通过');
          NODE
          if [[ "$CI_PROFILE" == platform ]]; then
            npm ci --workspace @rental-os/core-contracts --include-workspace-root --ignore-scripts \
              --no-audit --no-fund --cache "$task/npm-cache"
            npm run build -w @rental-os/core-contracts
            node packages/core-contracts/dist/export-platform.js --repo . \
              --repository https://github.com/JinPen-G/Nativark --commit "$GITHUB_SHA" --out "$task/platform.tgz"
          else
            npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
            mkdir "$task/offline"
            (
              export DATABASE_URL=mysql://offline:offline@127.0.0.1:1/rental_os_offline
              export AI_OFFLINE_WRITE_ROOT="$task" AI_OFFLINE_AUDIT="$task/offline/audit.log"
              export TEMP="$task/offline" TMP="$task/offline" TMPDIR="$task/offline" XDG_CACHE_HOME="$task/offline"
              node --no-compilation-cache --max-old-space-size=6144 \
                --require ./tests/fixtures/ai-native/prisma-offline-preload.cjs \
                scripts/prepare-platform-public-ai.cjs --repo . --repository https://github.com/JinPen-G/Nativark \
                --commit "$GITHUB_SHA" --out "$task/platform.tgz"
              test ! -e "$AI_OFFLINE_AUDIT"
            )
          fi
          tar -tzf "$task/platform.tgz" > "$task/archive.list"
          if grep -Eq '^(\./)?(assets|\.impeccable)(/|$)|(^|/)(docs|node_modules|output|deepseek-harness-clone|deepseek-harness-original|primefold-clone)(/|$)|^(apps/(api|rental-api|rental-admin|website|website-next)|packages/(rental-core|rental-mcp-host|shared))(/|$)' "$task/archive.list"; then
            echo '底座归档含私有资料或业务实现' >&2
            exit 1
          fi
          mkdir "$task/platform"
          tar -xzf "$task/platform.tgz" -C "$task/platform"
      - name: 独立安装、构建和登录
        working-directory: ${{ env.CI_DIR }}/platform
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          export AUTH_TOKEN_SECRET="$(openssl rand -hex 32)" SEED_PLATFORM_PASSWORD="ZeloCi9-$(openssl rand -hex 12)"
          export API_PORT=3091 API_PROXY_TARGET=http://127.0.0.1:3091 VITE_API_BASE_URL=/api DATABASE_CONNECT_ON_START=true
          npm ci --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
          node node_modules/@prisma/engines/scripts/postinstall.js
          npm run db:generate
          npm run build
          if [[ "$CI_PROFILE" == public-ai ]]; then
            (cd "$task/source" && npm run build -w @rental-os/example-tickets-core)
          fi
          for tool in platform-doctor platform-doctor-install platform-doctor-upgrade; do
            node "scripts/ops/$tool.cjs" --help > /dev/null
          done
          if [[ "$CI_PROFILE" == public-ai ]]; then
            export CORE_DEPLOYMENT_LOCK_FILE="$PWD/apps/platform-api/prisma-deployment/core.deployment.lock.json"
            export PLATFORM_AI_DATA_PACKAGE_DIR="$PWD/public-ai-data" PLATFORM_AI_PROFILE_ID=ci-public-profile
          fi
          approval=$(node scripts/ops/platform-doctor-install.cjs status --profile "$CI_PROFILE" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const r=JSON.parse(s);if(r.state!=="empty"){console.error(r);process.exit(1)}process.stdout.write(r.migrationApproval)})')
          node --input-type=module <<'INSTALL_GATES'
          import { strict as assert } from 'node:assert';
          import { createRequire } from 'node:module';
          import { spawnSync } from 'node:child_process';
          const require = createRequire(process.cwd() + '/package.json');
          const { PrismaClient } = require('./apps/platform-api/generated/client');
          const db = new PrismaClient({ datasourceUrl: process.env.DATABASE_URL });
          const invoke = (command, extra = []) => {
            const result = spawnSync(process.execPath, ['scripts/ops/platform-doctor-install.cjs', command,
              '--profile', process.env.CI_PROFILE, ...extra], { encoding: 'utf8' });
            return { code: result.status, value: JSON.parse(result.stdout) };
          };
          let created = false;
          try {
            const refused = invoke('migrate', ['--approve', '0'.repeat(64)]);
            assert.equal(refused.code, 1); assert.equal(refused.value.status, 'refused');
            assert.equal(invoke('status').value.state, 'empty');
            await db.$executeRaw`CREATE TABLE zp01_unknown_probe (id INT PRIMARY KEY)`; created = true;
            const unknown = invoke('status'); assert.equal(unknown.code, 1); assert.equal(unknown.value.state, 'incompatible');
            assert.equal(invoke('migrate', ['--approve', unknown.value.migrationApproval]).value.status, 'refused');
            assert.equal(invoke('initialize').value.status, 'refused');
            const objects = await db.$queryRaw`SELECT TABLE_NAME AS name FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE()`;
            assert.deepEqual(objects, [{ name: 'zp01_unknown_probe' }], '未知旧库拒绝不得添加迁移账或账号表');
            console.log('A01：未批准迁移与无原账旧库均拒绝，未产生初始化或迁移写入');
          } finally {
            if (created) await db.$executeRaw`DROP TABLE zp01_unknown_probe`;
            await db.$disconnect();
          }
          INSTALL_GATES
          node scripts/ops/platform-doctor-install.cjs migrate --profile "$CI_PROFILE" --approve "$approval"
          npm run db:migrate:deploy
          node scripts/ops/platform-doctor-install.cjs initialize --profile "$CI_PROFILE"
          npm run db:initialize
          node scripts/ops/platform-doctor-install.cjs status --profile "$CI_PROFILE" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const r=JSON.parse(s);if(r.state!=="ready"||r.initialization.state!=="initialized"||r.initialization.receipt!=="recorded"){console.error(r);process.exit(1)}})'
          SEED_PLATFORM_PASSWORD=RepeatCheck9 node scripts/ops/platform-doctor-install.cjs initialize --profile "$CI_PROFILE"
          # The selected AI host may use its local database. The smoke has no provider or supplier credentials.
          if [[ "$CI_PROFILE" == public-ai ]]; then
            export CORE_DEPLOYMENT_LOCK_FILE="$PWD/apps/platform-api/prisma-deployment/core.deployment.lock.json"
            export PLATFORM_AI_DATA_PACKAGE_DIR="$PWD/public-ai-data" PLATFORM_AI_PROFILE_ID=ci-public-profile
            npm run grant:ai -- --role role_saas_admin --access manage
            entry=apps/platform-api/dist-ai/ai-main.js
            web_args=(--mode public-ai --outDir dist-ai)
          else
            entry=apps/platform-api/dist/main.js
            web_args=()
          fi
          node "$entry" > "$task/api.log" 2>&1 &
          api_pid=$!
          cleanup_services() {
            kill "$api_pid" ${web_pid:+"$web_pid"} 2>/dev/null || true
            if [[ -n "${driver_pid:-}" ]]; then kill -- "-$driver_pid" 2>/dev/null || true; fi
            wait || true
            test "$task" = "$GITHUB_WORKSPACE/$CI_DIR"
            rm -rf -- "$task/distribution" "$task/private-source-browser"
          }
          trap cleanup_services EXIT
          node node_modules/vite/bin/vite.js preview apps/platform-admin --host 127.0.0.1 --port 5191 --strictPort "${web_args[@]}" > "$task/web.log" 2>&1 &
          web_pid=$!
          if ! curl -fsS --retry 15 --retry-connrefused --max-time 5 http://127.0.0.1:5191/api/health -o "$task/health.json"; then
            tail -n 30 "$task/api.log" "$task/web.log"
            exit 1
          fi
          if [[ "$CI_PROFILE" == public-ai ]]; then
            google-chrome --version
            "$CHROMEWEBDRIVER/chromedriver" --version
            setsid "$CHROMEWEBDRIVER/chromedriver" --port=9515 --allowed-ips=127.0.0.1 > "$task/browser.log" 2>&1 &
            driver_pid=$!
            curl -fsS --retry 10 --retry-connrefused --max-time 5 http://127.0.0.1:9515/status -o "$task/browser-status.json"
          fi
          node --input-type=module <<'NODE'
          import { strict as assert } from 'node:assert';
          import { createRequire } from 'node:module';
          import { randomBytes, randomUUID, createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync, renameSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          const web = 'http://127.0.0.1:5191';
          async function request(path, init) {
            const response = await fetch(web + path, { ...init, signal: AbortSignal.timeout(8000) });
            assert(response.ok, `${path}: HTTP ${response.status}`);
            return response;
          }
          const body = async (path, init) => { const json = await (await request(path, init)).json(); return json.data ?? json; };
          assert.equal((await body('/api/health')).service, 'nativark-platform-api');
          const login = await (await request('/login')).text();
          const entry = /<script\b[^>]*\bsrc="(\/assets\/[^"/]+\.js)"/.exec(login)?.[1];
          assert(entry, '独立后台缺少正式编译入口');
          assert.match((await request(entry)).headers.get('content-type') ?? '', /javascript/);
          const session = await body('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tenantCode: 'platform', account: 'admin', password: process.env.SEED_PLATFORM_PASSWORD }) });
          assert(typeof session.accessToken === 'string' && session.accessToken.length > 0, '独立公共登录未返回会话');
          const me = await body('/api/auth/session-context', { headers: { Authorization: `Bearer ${session.accessToken}` } });
          assert.equal(me.tenant.tenantCode, 'platform');
          assert.equal(me.user.account, 'admin');
          console.log('零 Core：独立 MySQL 迁移、公共后台产物、代理、登录及真实会话通过');
          if (process.env.CI_PROFILE === 'public-ai') {
            const json = { 'Content-Type': 'application/json' };
            const changed = await body('/api/auth/change-password', { method: 'POST',
              headers: { ...json, Authorization: `Bearer ${session.accessToken}` },
              body: JSON.stringify({ currentPassword: process.env.SEED_PLATFORM_PASSWORD,
                newPassword: `${process.env.SEED_PLATFORM_PASSWORD}-New8!` }) });
            const headers = { ...json, Authorization: `Bearer ${changed.accessToken}` };
            // 仅在既有独占库核来源配置，不访问 GitHub；合成 token 不具有外部获取权限。
            const sourcePath = '/api/platform/core-packages/private-source', repositories = ['https://github.com/zelo-ci/private-source-smoke'];
            const sourceToken = 'ghs_ci_' + randomBytes(384).toString('base64url') + '.ci.signature';
            const saveSource = value => body(sourcePath, { method: 'POST', headers, body: JSON.stringify(value) });
            const beforeSource = await body(sourcePath, { headers });
            const configured = await saveSource({ expectedRevision: beforeSource.revision, enabled: true, repositories, token: sourceToken });
            assert.equal(configured.credentialConfigured, true);
            assert.deepEqual(Object.keys(configured).sort(), ['credentialConfigured', 'enabled', 'provider', 'repositories', 'revision']);
            const { PrismaClient } = createRequire(process.cwd() + '/package.json')('./apps/platform-api/generated/client');
            const sourceDatabase = new PrismaClient({ datasourceUrl: process.env.DATABASE_URL });
            try {
              const stored = await sourceDatabase.tenantIntegrationConfig.findUnique({ where: {
                tenantId_capability_provider: { tenantId: 'tenant_platform', capability: 'core-package', provider: 'github' } } });
              assert(stored?.credentialsEncrypted?.startsWith('v2:') && !stored.credentialsEncrypted.includes(sourceToken), '来源凭据须以原加密信封保存');
            } finally { await sourceDatabase.$disconnect(); }
            const rotated = await saveSource({ expectedRevision: configured.revision, enabled: true, repositories, token: 'github_pat_ci_' + randomBytes(24).toString('hex') });
            assert.notEqual(rotated.revision, configured.revision);
            const revoked = await saveSource({ expectedRevision: rotated.revision, enabled: false, repositories, revokeToken: true });
            assert.equal(revoked.enabled, false); assert.equal(revoked.credentialConfigured, false);
            assert.deepEqual(await body(sourcePath, { headers }), revoked);
            console.log('私有来源：原 SaaS HTTP、独占 MySQL 加密配置、轮换/撤销与脱敏回读通过；未访问真实私有源');
            const task = resolve(process.env.GITHUB_WORKSPACE, process.env.CI_DIR), installation = join(task, 'distribution');
            const require = createRequire(process.cwd() + '/package.json'), sourceRequire = createRequire(join(task, 'source/package.json'));
            const contracts = require('@rental-os/core-contracts');
            const { packTicketsPackage } = sourceRequire('@rental-os/example-tickets-core/package');
            const platformSource = JSON.parse(readFileSync('platform.source.json', 'utf8'));
            const pack = packTicketsPackage({ directory: join(task, 'source/packages/example-tickets-core'),
              source: { repository: repositories[0], commit: process.env.GITHUB_SHA }, sourceDirectory: 'packages/example-tickets-core',
              platformSource: platformSource.source, platformTask: readFileSync(join(task, 'source/packages/core-contracts/README.md'), 'utf8') });
            const { composePlatformCorePackageAssembly } = require('@rental-os/platform-core-host/core-package-assembly');
            const { createEmptyCoreCatalogue } = require('@rental-os/platform-core-host');
            const { createPlatformCorePackageAudit } = require('@rental-os/platform-core-host/core-package-audit');
            const { createMysqlCoreDeploymentObservation } = require('@rental-os/core-host/mysql-deployment');
            const { createPublicPlatformDataPlan } = require('./apps/platform-api/dist/platform-data.js');
            const { runWithRequestIdentity } = require('@rental-os/platform-server/request-identity');
            const { PlatformIdentityRepository } = require('@rental-os/platform-server/identity');
            const { PlatformAuthenticationRepository } = require('@rental-os/platform-server/authentication');
            const { PlatformAuthService } = require('@rental-os/platform-server/auth');
            const { SecretBox } = require('@rental-os/platform-server/secret-box');
            const { TenantIntegrationService } = require('@rental-os/platform-server/tenant-integration');
            const { PlatformOperationLogService } = require('@rental-os/platform-server/operation-log');
            const { ConfigService } = require('@nestjs/config');
            const { prepareCoreInstall, requireCorePackagePin } = require('@rental-os/core-contracts/install');
            const config = new ConfigService({ AUTH_TOKEN_SECRET: process.env.AUTH_TOKEN_SECRET });
            const db = new PrismaClient({ datasourceUrl: process.env.DATABASE_URL }), users = new PlatformIdentityRepository(db);
            const auth = new PlatformAuthService(new PlatformAuthenticationRepository(db), config, undefined, undefined, db);
            const access = await auth.resolveAccessContext(headers.Authorization); assert(access?.tenantUser.isSaasAdmin);
            const identity = { tenantId: access.tenantUser.tenantId, userId: access.tenantUser.id, audience: 'operator', accessSession: access.accessSession };
            const platformData = createPublicPlatformDataPlan();
            const base = contracts.CoreDeploymentLockSchema.parse({ lockVersion: 1, cores: [], platform: { source: platformSource.source,
              sha256: createHash('sha256').update(readFileSync(join(task, 'platform.tgz'))).digest('hex'), data: platformData.data,
              versions: { platform: platformSource.version, contract: contracts.CORE_CONTRACT_VERSION, node: process.versions.node, capabilities: {} } } });
            for (const part of ['releases', 'candidates', 'archives', 'installed', 'results']) mkdirSync(join(installation, part), { recursive: true });
            const activeFile = join(installation, 'active.json'), read = path => JSON.parse(readFileSync(path, 'utf8'));
            writeFileSync(activeFile, JSON.stringify(base), { flag: 'wx' });
            const snapshot = async transaction => { const lock = read(activeFile); return { lock,
              installed: { platform: lock.platform, cores: lock.cores },
              data: await createMysqlCoreDeploymentObservation({ database: transaction, platform: platformData, cores: [] }).read() }; };
            let submissions = 0, rejectSubmission = true, redirected = 0;
            const fetcher = async (url, options) => {
              const path = new URL(url).pathname, authorization = new Headers(options.headers).get('authorization');
              if (new URL(url).hostname === 'release-assets.githubusercontent.com') {
                assert.equal(authorization, null); redirected++; return new Response(pack.bytes);
              }
              assert.equal(new URL(url).origin, 'https://api.github.com'); assert(authorization === `Bearer ${sourceToken}`, '原仓库 API 须使用当前来源凭据');
              const prefix = '/repos/zelo-ci/private-source-smoke'; let value;
              if (path === prefix) value = { id: 1001, private: true, archived: false, html_url: repositories[0], full_name: 'zelo-ci/private-source-smoke' };
              else if (path === `${prefix}/releases/tags/v${pack.manifest.version}`) value = { id: 1002, tag_name: `v${pack.manifest.version}`,
                draft: false, prerelease: false, published_at: new Date().toISOString(), assets: [{ id: 1003, name: `${pack.manifest.id}-${pack.manifest.version}.tgz`,
                  state: 'uploaded', size: pack.bytes.length, digest: `sha256:${pack.sha256}` }] };
              else if (path === `${prefix}/git/ref/tags/v${pack.manifest.version}`) value = { ref: `refs/tags/v${pack.manifest.version}`,
                object: { type: 'commit', sha: process.env.GITHUB_SHA } };
              else if (path === `${prefix}/releases/assets/1003`) return new Response(null, { status: 302,
                headers: { location: 'https://release-assets.githubusercontent.com/ci-private-asset' } });
              else throw Error('受控 GitHub 传输出现未登记路径');
              return Response.json(value);
            };
            const executor = { id: 'ci-local-install',
              async authorize(transaction, operation, record) {
                const approval = await transaction.operationLog.findUnique({ where: { id: operation.approvalReference } });
                assert.equal(approval?.action, 'ci.core.deployment.approved'); assert.equal(approval.tenantId, identity.tenantId);
                assert.equal(approval.userId, identity.userId); assert.equal(approval.detail.sha256, record.sha256);
                assert.equal(approval.detail.executorId, operation.executorId);
              },
              async submit(operation, record) {
                submissions++;
                const result = { sha256: record.sha256, dispatchId: operation.dispatchId, receipt: operation.dispatchId };
                if (rejectSubmission) {
                  writeFileSync(join(installation, 'results', operation.dispatchId + '.json'), JSON.stringify({ ...result, status: 'failed' }), { flag: 'wx' }); return;
                }
                const installed = prepareCoreInstall(pack.bytes, pack.sha256, join(installation, 'installed'),
                  contracts.coreDeploymentHostVersions(record.plan.candidate), pack.manifest);
                requireCorePackagePin(installed.directory, record.plan.artifact.pin, contracts.coreDeploymentHostVersions(record.plan.candidate));
                writeFileSync(activeFile + '.next', JSON.stringify(record.plan.candidate), { flag: 'wx' }); renameSync(activeFile + '.next', activeFile);
                writeFileSync(join(installation, 'results', operation.dispatchId + '.json'), JSON.stringify({ ...result, status: 'succeeded', directory: installed.directory }), { flag: 'wx' });
                throw Error('受控安装已提交后失应答');
              },
              async observe(operation) {
                const result = read(join(installation, 'results', operation.dispatchId + '.json')), current = read(activeFile);
                if (result.status === 'succeeded') requireCorePackagePin(result.directory, current.cores[0], contracts.coreDeploymentHostVersions(current));
                return { status: result.status, sha256: result.sha256, dispatchId: result.dispatchId, receipt: result.receipt, current };
              } };
            const compose = () => composePlatformCorePackageAssembly({ database: db, users, audit: createPlatformCorePackageAudit(),
              catalogue: createEmptyCoreCatalogue(), storageDirectory: installation, sourceVault: new SecretBox(config), fetcher, deploymentExecutor: executor,
              deployment: { read: () => snapshot(db), readInTransaction: snapshot }, materials: { async read() { return { base,
