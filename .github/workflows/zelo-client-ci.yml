name: Zelo 可选客户端宿主

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zelo-client-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# 仅按已核固定成果更新；不能用活动分支、修改清单或放宽门禁凑兼容。
env:
  ZELO_COMMIT: 6d46f4943f7a0538f04e7ee2d908827d8345a666
  RENTAL_COMMIT: 5b008083b7cf76c2127216d163f529e5526136a6
  CI_DIR: output/.tmp/zelo-client-ci

jobs:
  selected-source:
    name: 四个入口分别准备与构建（不是宿主验收）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出客户端候选
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ${{ env.CI_DIR }}/client
          persist-credentials: false
      - name: 检出固定 Rental
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JinPen-G/Zelo-rental-core
          ref: ${{ env.RENTAL_COMMIT }}
          path: ${{ env.CI_DIR }}/rental
          persist-credentials: false
      - name: 固定 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: 沿公开入口单端准备、安装原锁和构建
        working-directory: ${{ env.CI_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          test "$(git -C client rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C rental rev-parse HEAD)" = "$RENTAL_COMMIT"
          for surface in customer-web staff-web wechat-customer wechat-staff; do
            node client/templates/platform-clients/prepare.cjs --surface "$surface" --client-commit "$GITHUB_SHA" \
              --rental-repo "$task/rental" --rental-commit "$RENTAL_COMMIT" --out "$task/selected"
            (
              cd selected
              npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
              npm run build
              node --input-type=module - "$surface" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync, writeFileSync, appendFileSync } from 'node:fs';
          const surface = process.argv[2], source = JSON.parse(readFileSync('client.workspace.json'));
          assert.equal(source.surface, surface);
          assert.equal(source.client.commit, process.env.GITHUB_SHA);
          assert.equal(source.platform.commit, process.env.GITHUB_SHA);
          assert.equal(source.rental.commit, process.env.RENTAL_COMMIT);
          const entries = source.workspaces.filter(path => /\/(customer-web|staff-web|wechat-customer|wechat-staff)$/.test(path));
          assert.deepEqual(entries, ['templates/platform-clients/' + surface]);
          const output = readdirSync(entries[0] + '/dist', { recursive: true });
          assert(output.includes(surface.startsWith('wechat-') ? 'app.js' : 'index.html'));
          const report = { ...source, installed: true, built: true, outputFiles: output.length };
          writeFileSync('../' + surface + '.json', JSON.stringify(report, null, 2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${surface}：独立原锁安装、类型和构建通过；未运行业务宿主。\n`);
          NODE
            )
            test "$(realpath selected)" = "$task/selected"
            rm -rf -- selected
          done
      - name: 保存单端构建来源
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zelo-client-selected-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_DIR }}/customer-web.json
            ${{ env.CI_DIR }}/staff-web.json
            ${{ env.CI_DIR }}/wechat-customer.json
            ${{ env.CI_DIR }}/wechat-staff.json
          if-no-files-found: error
          retention-days: 7
      - name: 清理独立源码与构建目录
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          test "$CI_DIR" = output/.tmp/zelo-client-ci
          test "$(realpath -m "$task")" = "$GITHUB_WORKSPACE/output/.tmp/zelo-client-ci"
          rm -rf -- "$task"
          test ! -e "$task"

  combination:
    name: 固定组合前检（不是 A03 验收）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: 检出客户端候选
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ${{ env.CI_DIR }}/client
          persist-credentials: false
      - name: 检出已核底座
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.ZELO_COMMIT }}
          path: ${{ env.CI_DIR }}/platform
          persist-credentials: false
      - name: 检出固定 Rental
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JinPen-G/Zelo-rental-core
          ref: ${{ env.RENTAL_COMMIT }}
          path: ${{ env.CI_DIR }}/rental
          persist-credentials: false
      - name: 固定 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: 使用原版本合同读取组合缺项
        id: check
        working-directory: ${{ env.CI_DIR }}/platform
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          test "$(git rev-parse HEAD)" = "$ZELO_COMMIT"
          test "$(git -C "$task/rental" rev-parse HEAD)" = "$RENTAL_COMMIT"
          test "$(git -C "$task/client" rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --workspace @rental-os/core-contracts --include-workspace-root --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
          node <<'NODE'
          const assert = require('node:assert/strict'), fs = require('node:fs'), path = require('node:path');
          const { readBuildSnapshot } = require('./scripts/rental-build-snapshot.cjs');
          const { readIndependentRentalSource, composeRentalBuildSnapshot } = require('./scripts/prepare-rental-workspace.cjs');
          const { createBuild } = require('./scripts/check-rental-package-build.cjs');
          const task = path.resolve(process.env.GITHUB_WORKSPACE, process.env.CI_DIR);
          const read = file => JSON.parse(fs.readFileSync(path.join(task, file), 'utf8'));
          const platform = read('platform/package.json'), rental = read('rental/package.json');
          const support = readBuildSnapshot(process.env.ZELO_COMMIT, process.cwd(), ['package.json', 'package-lock.json',
            'tsconfig.base.json', 'packages/platform-contracts', 'packages/core-contracts']);
          const core = readIndependentRentalSource(path.join(task, 'rental'), process.env.RENTAL_COMMIT, { mode: 'development' });
          const build = createBuild(path.resolve('node_modules'), { snapshot: composeRentalBuildSnapshot(support, core), quiet: true });
          build.compile('packages/platform-contracts/tsconfig.json');
          build.compile('packages/core-contracts/tsconfig.json');
          // 发现清单可保留历史发行；候选范围来自固定源码的正式工厂，产物只驻内存。
          const config = 'packages/rental-core/tsconfig.client-manifest.json';
          build.virtual.set(path.resolve(config).split(path.sep).join('/'), JSON.stringify({ extends: './tsconfig.json',
            files: ['src/manifest.ts'], include: [] }));
          build.compile(config);
          const { CoreManifestSchema, isCoreVersionSupported, CORE_CONTRACT_VERSION } = build.load(build.exported('@rental-os/core-contracts', true));
          const { createRentalManifest } = build.load(build.exported('@rental-os/rental-core/manifest', true));
          const manifest = CoreManifestSchema.parse(createRentalManifest({ source: core.source, assets: [] }));
          const sdk = read('platform/packages/ai-native-data/package.public.json');
          const { publicDataSdkFor } = require('./scripts/rental-host-lock.cjs');
          const publicDataSdk = publicDataSdkFor(sdk);
          const host = read('rental/workspace/apps/rental-api/package.json');
          const adapter = read('client/templates/platform-clients/rental/package.json');
          const source = fs.readFileSync(path.join(task, 'client/templates/platform-clients/rental/config.ts'), 'utf8');
          const missing = [];
          assert.equal(manifest.id, 'rental');
          assert.equal(manifest.version, rental.version);
          if (rental.exports?.['./clients/contribution'] !== './clients/contribution/index.ts') missing.push('Rental 缺少正式客户端贡献出口');
          if (!isCoreVersionSupported(platform.version, manifest.compatibility.platform)) missing.push('Rental 清单尚不支持所选底座 ' + platform.version);
          if (!isCoreVersionSupported(CORE_CONTRACT_VERSION, manifest.compatibility.contract)) missing.push('Rental 清单不支持所选 Core 合同');
          if (publicDataSdk.version !== sdk.version) missing.push(`新装锁 SDK ${publicDataSdk.version} 与同源 SDK ${sdk.version} 不符`);
          if (host.peerDependencies['@rental-os/public-ai-data'] !== publicDataSdk.declaration) missing.push('Rental 新装宿主 SDK 声明与同源归档不符');
          if (adapter.peerDependencies['@rental-os/rental-core'] !== rental.version) missing.push('客户端可选 peer 尚未采用所选 Rental 版本');
          if (!source.includes(`RENTAL_CLIENT_SOURCE = "${process.env.RENTAL_COMMIT}"`)) missing.push('客户端固定来源与 CI 所选 Rental 不符');
          const report = { client: process.env.GITHUB_SHA, platform: process.env.ZELO_COMMIT, rental: process.env.RENTAL_COMMIT,
            rentalVersion: manifest.version, compatibility: manifest.compatibility, manifestSource: '@rental-os/rental-core/manifest',
            state: missing.length ? 'unavailable' : 'ready_for_host_attempt', missing,
            browserExecuted: false, databaseChecked: false, wechatExecuted: false, a03Accepted: false };
          fs.writeFileSync(path.join(task, 'combination.json'), JSON.stringify(report, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${missing.length === 0}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## 客户端固定组合\n\n状态：${report.state}。此前检不表示真实宿主或 A03 通过。\n\n`
            + missing.map(reason => '- ' + reason).join('\n') + '\n\n' + [report.client, report.platform, report.rental].map(sha => '`' + sha + '`').join(' / ') + '\n');
          console.log(JSON.stringify(report));
          NODE
      - name: 保存无凭据的组合结果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zelo-client-combination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_DIR }}/combination.json
          if-no-files-found: error
          retention-days: 7
      - name: 清理前检材料
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          test "$CI_DIR" = output/.tmp/zelo-client-ci
          test "$(realpath -m "$task")" = "$GITHUB_WORKSPACE/output/.tmp/zelo-client-ci"
          rm -rf -- "$task"
          test ! -e "$task"

  web-host:
    name: 独立 v2 宿主与客户员工 Web
    needs: combination
    if: needs.combination.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: zelo_client_ci_root_only
          MYSQL_DATABASE: zelo_client_ci
          MYSQL_USER: zelo_ci
          MYSQL_PASSWORD: zelo_client_ci_database_only
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - name: 检出客户端候选
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ${{ env.CI_DIR }}/client
          persist-credentials: false
      - name: 检出已核底座
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.ZELO_COMMIT }}
          path: ${{ env.CI_DIR }}/platform
          persist-credentials: false
      - name: 检出固定 Rental
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JinPen-G/Zelo-rental-core
          ref: ${{ env.RENTAL_COMMIT }}
          path: ${{ env.CI_DIR }}/rental
          persist-credentials: false
      - name: 固定 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: 沿 Rental 原入口准备固定 v2 新装包
        working-directory: ${{ env.CI_DIR }}/platform
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          test "$(git rev-parse HEAD)" = "$ZELO_COMMIT"
          test "$(git -C "$task/rental" rev-parse HEAD)" = "$RENTAL_COMMIT"
          test "$(git -C "$task/client" rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
          mkdir "$task/temporary"
          export DATABASE_URL=mysql://offline:offline@127.0.0.1:1/rental_os_offline
          export AI_OFFLINE_WRITE_ROOT="$task/temporary" AI_OFFLINE_AUDIT="$task/temporary/audit.log"
          export TEMP="$task/temporary" TMP="$task/temporary" TMPDIR="$task/temporary" XDG_CACHE_HOME="$task/temporary"
          guard="$PWD/tests/fixtures/ai-native/prisma-offline-preload.cjs"
          node --no-compilation-cache --max-old-space-size=6144 --require "$guard" \
            "$task/rental/tools/prepare-workspace.cjs" --framework-repo "$PWD" --framework-commit "$ZELO_COMMIT" \
            --repository https://github.com/JinPen-G/Nativark --core-commit "$RENTAL_COMMIT" \
            --mode development --profile host --fresh-ai --out "$task/temporary/dependencies.tgz"
          mkdir "$task/dependencies"
          tar -xzf "$task/temporary/dependencies.tgz" -C "$task/dependencies"
          (cd "$task/dependencies"; npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache")
          node --no-compilation-cache --max-old-space-size=6144 --require "$guard" \
            scripts/package-rental-host.cjs --development --fresh-ai --repo "$PWD" \
            --repository https://github.com/JinPen-G/Nativark --commit "$ZELO_COMMIT" \
            --core-repo "$task/rental" --core-commit "$RENTAL_COMMIT" \
            --deps "$task/dependencies/node_modules" --output "$task/temporary/host.tgz"
          test ! -e "$AI_OFFLINE_AUDIT"
          mkdir "$task/host"
          tar -xzf "$task/temporary/host.tgz" -C "$task/host"
          node - "$task/host" <<'NODE'
          const assert = require('node:assert/strict'), fs = require('node:fs'), path = require('node:path');
          const root = process.argv[2], read = file => JSON.parse(fs.readFileSync(path.join(root, file)));
          const receipt = read('rental-host.context.json'), source = read('development.workspace.json');
          assert.equal(receipt.installation, 'fresh-ai'); assert.equal(receipt.sourceMode, 'development');
          assert.equal(receipt.releaseApproved, false); assert.equal(receipt.serverUpdateEligible, false);
          assert.equal(source.platform.source.commit, process.env.ZELO_COMMIT);
          assert.equal(source.core.source.commit, process.env.RENTAL_COMMIT);
          const lock = read('apps/rental-api/prisma-deployment/core.deployment.lock.json');
          assert.equal(lock.lockVersion, 2); assert.equal(lock.postCapability.length, 1);
          assert.deepEqual(lock.base.dataCapabilities.map(row => row.id), ['ai-native']);
          const migrations = fs.readdirSync(path.join(root, 'apps/rental-api/prisma-deployment/migrations'), { withFileTypes: true })
            .filter(row => row.isDirectory()).map(row => row.name).sort();
          assert.equal(migrations.length, 18);
          assert.equal(migrations.at(-1), 'post-capability.rental.rental.20261127000000-ai-extension');
          NODE
      - name: 两个 Web 分别沿单端入口装配固定底座
        working-directory: ${{ env.CI_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          mkdir web
          for surface in customer-web staff-web; do
            node client/templates/platform-clients/prepare.cjs --surface "$surface" --client-commit "$GITHUB_SHA" \
              --platform-repo "$task/platform" --platform-commit "$ZELO_COMMIT" \
              --rental-repo "$task/rental" --rental-commit "$RENTAL_COMMIT" --out "$task/web/$surface"
          done
          node <<'NODE'
          const fs = require('node:fs');
          for (const [surface, port] of [['customer-web', 5194], ['staff-web', 5195]]) {
            const config = { apiOrigin: `https://127.0.0.1:${port}`, tenantCode: 'client-ci', brand: { name: '客户端 CI 租户' } };
            fs.writeFileSync(`web/${surface}/templates/platform-clients/${surface}/connection.ts`, `export const connection = ${JSON.stringify(config)};\n`);
          }
          NODE
          for surface in customer-web staff-web; do
            (
              cd "web/$surface"
              npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
              npm run build
            )
          done
      - name: 独占 MySQL 初始化及真实客户员工页面
        working-directory: ${{ env.CI_DIR }}/host
        shell: bash
        env:
          DATABASE_URL: mysql://zelo_ci:zelo_client_ci_database_only@127.0.0.1:3306/zelo_client_ci?connection_limit=2
          API_PORT: '3094'
          RENTAL_AI_MODE: enabled
          CORS_ALLOWED_ORIGINS: https://127.0.0.1:5194,https://127.0.0.1:5195
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/$CI_DIR"
          export AUTH_TOKEN_SECRET="$(openssl rand -hex 32)" SEED_PLATFORM_PASSWORD="ClientCi9-$(openssl rand -hex 12)"
          export RENTAL_DEPLOYMENT_LOCK="$PWD/apps/rental-api/prisma-deployment/core.deployment.lock.json"
          export RENTAL_PUBLIC_AI_DATA_PACKAGE_DIR="$PWD/public-ai-data"
          npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
          node node_modules/@prisma/engines/scripts/postinstall.js
          node node_modules/prisma/build/index.js generate --schema apps/platform-api/prisma/schema.prisma
          node node_modules/prisma/build/index.js generate --schema apps/rental-api/prisma-deployment/schema.prisma
          node verify-runtime.cjs
          node node_modules/prisma/build/index.js migrate deploy --schema apps/rental-api/prisma-deployment/schema.prisma
          node apps/platform-api/dist/initialize.js
          node apps/rental-api/dist-ai/ai-fresh-initialize.js
          node apps/rental-api/dist-ai/ai-fresh-main.js > "$task/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" ${driver_pid:+"$driver_pid"} 2>/dev/null || true; wait || true' EXIT
          curl -fsS --retry 30 --retry-delay 1 --retry-max-time 60 --retry-connrefused --max-time 5 http://127.0.0.1:3094/api/health -o "$task/health.json"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$task/localhost.key" -out "$task/localhost.crt" \
            -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 2> "$task/certificate.log"
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          "$CHROMEWEBDRIVER/chromedriver" --port=9515 --allowed-ips=127.0.0.1 > "$task/browser.log" 2>&1 &
          driver_pid=$!
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused --max-time 5 http://127.0.0.1:9515/status -o "$task/browser-status.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createServer } from 'node:https';
          import { request as forward } from 'node:http';
          import { resolve, extname, sep } from 'node:path';
          const task = resolve(process.env.GITHUB_WORKSPACE, process.env.CI_DIR), origin = 'http://127.0.0.1:3094';
          async function api(path, token, body, expected = body === undefined ? 200 : 201, method = body === undefined ? 'GET' : 'POST') {
            const response = await fetch(origin + path, { method,
              headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}),
                ...(method === 'POST' ? { 'Idempotency-Key': randomUUID() } : {}) },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }), signal: AbortSignal.timeout(15000) });
            assert.equal(response.status, expected, `${path}: HTTP ${response.status}`);
            const value = await response.json(); assert(Object.hasOwn(value, 'data')); return value.data;
          }
          const manage = (route, token, body) => api('/api/platform/core-host/' + route, token, { coreId: 'rental', ...body }, 200);
          async function operatorLogin(tenantCode, account, initial) {
            const session = await api('/api/auth/login', undefined, { tenantCode, account, password: initial });
            return api('/api/auth/change-password', session.accessToken, { currentPassword: initial, newPassword: 'Client9-' + randomUUID() });
          }
          const saas = await operatorLogin('platform', 'admin', process.env.SEED_PLATFORM_PASSWORD);
          const admission = await manage('deployment-admission/read', saas.accessToken, {});
          await manage('deployment-admission', saas.accessToken, { state: 'accepting', expectedRevision: admission.revision, operationId: randomUUID() });
          const tenant = await api('/api/platform/tenant-bootstrap', saas.accessToken, { tenantCode: 'client-ci', tenantName: '客户端 CI 租户',
            categoryCode: 'camping', adminAccount: 'setup', adminDisplayName: 'CI准备管理员' });
          const admin = await operatorLogin('client-ci', 'setup', tenant.temporaryPassword);
          const tenantId = tenant.tenant.tenantId;
          let grant = await manage('tenant-grants', saas.accessToken, { tenantId, state: 'enabled', expectedRevision: 0, operationId: randomUUID() });
          await manage('member-assignments', admin.accessToken, { userId: tenant.adminUser.id, state: 'assigned', expectedRevision: 0, operationId: randomUUID() });
          // 租户管理接口与订单空间各有原绑定；不能把一个范围的绑定冒充另一个。
          await manage('bindings', admin.accessToken, { expectedRevision: 0, operationId: randomUUID() });
          const spaces = await api('/api/platform/workspaces', admin.accessToken);
          const workspace = spaces.find(row => row.isDefault); assert(workspace);
          await manage('bindings', admin.accessToken, { container: { type: 'rental-workspace', id: workspace.id }, expectedRevision: 0, operationId: randomUUID() });
          const role = await api('/api/platform/roles', admin.accessToken, { code: 'CLIENT_CI_STAFF', name: '客户端 CI 普通员工', scope: 'operator',
            enabledBusinessScopes: [], permissions: ['rental-os:order:view', 'rental-os:order:operate'], dataScope: 'all', isActive: true });
          assert.equal(role.fixedAllPermissions, false); assert(!role.permissions.includes('*'));
