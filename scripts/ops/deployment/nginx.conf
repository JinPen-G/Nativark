# IP 的 HTTP 入口统一进入 HTTPS，工作台所需的加密 API 依赖安全上下文。
map $http_upgrade $rental_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen 81 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name _;

    location = /api/health {
        proxy_pass http://api:3000;
    }

    location / {
        return 308 https://rentaltest.rimo.pro:8080$request_uri;
    }
}

server {
    listen 444 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name _;
    ssl_certificate /etc/nativark/tls/fullchain.pem;
    ssl_certificate_key /etc/nativark/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rental_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
