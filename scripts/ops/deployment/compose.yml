name: nativark-demo
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ./mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=268435456
      - --binlog-expire-logs-seconds=604800
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    profiles: [app]
    image: nativark-api:${RENTAL_RELEASE:?Set RENTAL_RELEASE to the pinned product commit}
    restart: unless-stopped
    env_file: ./runtime.env
    environment:
      NODE_ENV: development
      RENTAL_DEPLOYMENT_PROFILE: personal-demo
      API_PORT: "3000"
      TRUST_PROXY_HOPS: "1"
      RENTAL_UPLOAD_DIR: /data/uploads
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      mysql: {condition: service_healthy}
    mem_limit: 1024m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  web:
    profiles: [app]
    image: nativark-web:${RENTAL_RELEASE:?Set RENTAL_RELEASE to the pinned product commit}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /home/ritiadm/carRental/cert/fullchain.pem:/etc/nativark/tls/fullchain.pem:ro
      - /home/ritiadm/carRental/cert/rimo_pro.key:/etc/nativark/tls/private.key:ro
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  mysql_data:
